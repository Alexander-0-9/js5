<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Keanu Reeves Filmkort</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="card">

        <h1 id="title">Laster film...</h1>

        <div class="film-info">

            <img id="poster" src="" alt="Filmplakat">

            <div class="info">

                <p>
                    <strong>Årstall:</strong>
                    <span id="year">-</span>
                </p>

                <p>
                    <strong>Regissør:</strong>
                    <span id="director">-</span>
                </p>

                <p>
                    <strong>Rollegur:</strong>
                    <span id="actors">-</span>
                </p>

                <p>
                    <strong>Filmsitat:</strong>
                    <span id="quote">-</span>
                </p>

                <p>
                    <strong>Tidspunkt:</strong>
                    <span id="timestamp">-</span>
                </p>

                <p>
                    <strong>Antall Whoa:</strong>
                    <span id="whoaCount">-</span>
                </p>

            </div>

        </div>

        <h3>Se filmklippet</h3>

        <video id="video" controls></video>

        <button id="newFilm">Ny film</button>

    </div>

    <script src="index.js"></script>

</body>
</html>
